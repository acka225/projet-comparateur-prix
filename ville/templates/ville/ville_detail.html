{% extends "base.html" %}
{% block title %}Ville : {{ ville.nom }}{% endblock %}

{% block content %}
<h1>{{ ville.nom }}</h1>
<p><strong>Population :</strong> {{ ville.population }} habitants</p>
<p><strong>Description :</strong> {{ ville.description }}</p>
<a href="{% url 'ville_list' %}" class="btn btn-secondary">← Retour</a>
{% endblock %}
